<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B2" />
      <stop offset="20%" stop-color="#DFBA73" />
      <stop offset="45%" stop-color="#C5A059" />
      <stop offset="70%" stop-color="#F3DCA0" />
      <stop offset="100%" stop-color="#8E6922" />
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.4" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Tuxedo Facet Silhouette -->
  <!-- Left Lapel -->
  <path d="M 80 18 L 48 34 L 40 76 L 56 106 L 80 138 L 76 96 L 68 84 L 80 72 Z" 
        stroke="url(#goldMetallic)" stroke-width="2.5" stroke-linejoin="round" fill="url(#goldSoft)" fill-opacity="0.12" />
  
  <!-- Right Lapel (Symmetric) -->
  <path d="M 80 18 L 112 34 L 120 76 L 104 106 L 80 138 L 84 96 L 92 84 L 80 72 Z" 
        stroke="url(#goldMetallic)" stroke-width="2.5" stroke-linejoin="round" fill="url(#goldSoft)" fill-opacity="0.12" />

  <!-- Inner V Collar Line -->
  <path d="M 64 36 L 80 62 L 96 36" stroke="url(#goldMetallic)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bowtie Knot & Wings -->
  <!-- Left Bow Wing -->
  <path d="M 80 50 L 67 43 L 65 57 Z" fill="url(#goldMetallic)" />
  <!-- Right Bow Wing -->
  <path d="M 80 50 L 93 43 L 95 57 Z" fill="url(#goldMetallic)" />
  <!-- Bow Center Knot -->
  <circle cx="80" cy="50" r="3" fill="#FFF3D6" stroke="url(#goldMetallic)" stroke-width="1.2" />

  <!-- Tuxedo Chest Pocket / Handkerchief Accent -->
  <path d="M 96 78 L 108 76" stroke="url(#goldMetallic)" stroke-width="2" stroke-linecap="round" />
  <path d="M 100 75 L 104 68 L 107 75" fill="url(#goldMetallic)" />

  <!-- Vertical Tailored Center Accent & Buttons -->
  <circle cx="80" cy="84" r="2.2" fill="url(#goldMetallic)" />
  <circle cx="80" cy="98" r="2.2" fill="url(#goldMetallic)" />
  <circle cx="80" cy="112" r="2.2" fill="url(#goldMetallic)" />

  <!-- Subtle Outer Diamond Frame Accent -->
  <path d="M 80 6 L 138 46 L 138 108 L 80 152 L 22 108 L 22 46 Z" 
        stroke="url(#goldMetallic)" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="4 3" />
</svg>
